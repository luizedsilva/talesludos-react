<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visualização - TalesLudos</title>
  <script src="js/p5.js"></script>
  <script src="js/p5.dom.min.js"></script>
  <script src="js/p5.sound.min.js"></script>
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <style>
    #preview-msg { font-family: sans-serif; padding: 2rem; color: #333; }
  </style>
</head>
<body>
  <span style="display:none;"><img src="media/marca.png" id="marca"></span>
  <span style="display:none;"><img src="media/walk.png" id="walk"></span>
  <span style="display:none;"><img src="media/idle.png" id="idle"></span>
  <span style="display:none;"><img src="media/tablet.png" id="fundo"></span>
  <span style="display:none;"><img id="mapa"></span>
  <div id="preview-msg">Carregando o jogo...</div>

  <!--
    Visualização local de um projeto do editor. O projeto é lido do IndexedDB
    (mesmo banco usado em src/storage/db.js) e o motor do jogo é carregado
    depois que a variável global "game" e a imagem do mapa estão prontas.
  -->
  <script>
    (function () {
      var DB_NAME = 'talesludos';
      var STORE = 'projects';
      var msg = document.getElementById('preview-msg');

      function fail(text) {
        msg.textContent = text;
      }

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = function () { reject(new Error('Falha ao carregar ' + src)); };
          document.body.appendChild(s);
        });
      }

      function readProject(id) {
        return new Promise(function (resolve, reject) {
          var req = indexedDB.open(DB_NAME);
          var created = false;
          // O banco ainda não existe: não o cria aqui (quem cria é o editor).
          req.onupgradeneeded = function () { created = true; req.transaction.abort(); };
          req.onerror = function () { created ? resolve(null) : reject(req.error); };
          req.onsuccess = function () {
            var db = req.result;
            if (!db.objectStoreNames.contains(STORE)) return resolve(null);
            var get = db.transaction(STORE, 'readonly').objectStore(STORE).get(id);
            get.onsuccess = function () { resolve(get.result); };
            get.onerror = function () { reject(get.error); };
          };
        });
      }

      var id = new URLSearchParams(location.search).get('id');
      if (!id) return fail('Nenhum projeto indicado.');

      readProject(id).then(function (project) {
        if (!project) throw new Error('Projeto não encontrado neste navegador.');
        if (!project.image) throw new Error('O projeto não tem imagem de fundo.');

        var g = project.game || {};
        window.game = {
          title: project.title || '',
          introduce: (project.description || '').replace(/\r|\n/g, ''),
          marks: g.marks || { coords: [], nextMark: 1 },
          links: (g.links || []).filter(function (l) { return !l.removed; }),
          scenes: g.scenes || [],
          challenges: g.challenges || []
        };
        document.title = (project.title || 'Jogo') + ' - Visualização';

        return new Promise(function (resolve, reject) {
          var img = document.getElementById('mapa');
          img.onload = resolve;
          img.onerror = function () { reject(new Error('Não foi possível ler a imagem de fundo.')); };
          img.src = URL.createObjectURL(project.image);
        });
      }).then(function () {
        return ['config/digitos.js', 'js/scenario.js', 'js/particula.js', 'js/sketch.js', 'js/confetti.js']
          .reduce(function (p, src) { return p.then(function () { return loadScript(src); }); }, Promise.resolve());
      }).then(function () {
        msg.remove();
        // Se o evento "load" já passou, o p5 não se inicializa sozinho.
        if (document.readyState === 'complete' && !p5.instance) new p5();
      }).catch(function (err) {
        fail(err.message || String(err));
      });
    })();
  </script>
</body>
</html>
